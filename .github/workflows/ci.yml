name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Unit tests, screenshots, debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: android
    env:
      LOMIO_CCACHE: "1"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4

      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;30.0.16248370" "cmake;3.31.6" > /dev/null

      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: llama-${{ hashFiles('.gitmodules', 'android/llama/src/main/cpp/**', 'android/llama/build.gradle.kts') }}
          restore-keys: llama-
          max-size: 2G

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests (+ Roborazzi screenshots)
        run: ./gradlew --max-workers=4 testDebugUnitTest

      - name: Assemble debug APK and end-to-end test APK
        run: ./gradlew --max-workers=4 assembleDebug assembleDebugAndroidTest

      - name: Check native libraries in the APK
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          unzip -l $apk | grep '\.so$'
          unzip -l $apk | grep -q 'lib/arm64-v8a/liblomio_jni.so'
          # The OpenCL stub is link-time only; the device's driver must be the one loaded.
          if unzip -l $apk | grep -q 'libOpenCL\.so'; then echo "::error::libOpenCL.so stub packaged"; exit 1; fi
          echo "APK size: $(stat -c %s $apk) bytes"
          for abi in arm64-v8a x86_64; do
            echo "native libs $abi (uncompressed): $(unzip -l $apk "lib/$abi/*" | tail -1 | awk '{print $1}') bytes"
          done

      - name: Collect APKs
        run: |
          mkdir -p ../apks
          cp app/build/outputs/apk/debug/app-debug.apk ../apks/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk ../apks/

      - uses: actions/upload-artifact@v7
        with:
          name: lomio-debug-apk
          path: apks/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: room-schema
          path: android/app/schemas/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: android/app/build/outputs/roborazzi/*.png
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: |
            android/*/build/reports/tests/
            android/*/build/test-results/

  emulator:
    name: Emulator end-to-end (real llama.cpp, tiny GGUF)
    needs: android
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # llama2.c stories15M (MIT), 21 MB, Q4_K_M; trained with a 256-token context.
      E2E_MODEL_URL: https://huggingface.co/mradermacher/llama2.c-stories15M-GGUF/resolve/main/llama2.c-stories15M.Q4_K_M.gguf
      E2E_MODEL_SHA256: 212ddc793f14a6f0c90e6c2a8a22dc8138bc6535f4c468fe94954aa4ac7de509
      E2E_MODEL: models/e2e-model.gguf
      # Smallest vision model llama.cpp supports well: SmolVLM-256M (Apache-2.0), Q8_0 weights
      # 175 MB + Q8_0 projector 104 MB, pinned to a commit of ggml-org's repo.
      E2E_VISION_BASE: https://huggingface.co/ggml-org/SmolVLM-256M-Instruct-GGUF/resolve/b9e4379657e1450d04d02eec8e345667265b0a00
      E2E_VISION_MODEL_SHA256: 2a31195d3769c0b0fd0a4906201666108834848db768af11de1d2cef7cd35e65
      E2E_VISION_MMPROJ_SHA256: 7e943f7c53f0382a6fc41b6ee0c2def63ba4fded9ab8ed039cc9e2ab905e0edd
      E2E_VISION_MODEL: models/e2e-vision.gguf
      E2E_VISION_MMPROJ: models/e2e-vision-mmproj.gguf
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: lomio-debug-apk
          path: apk

      - name: Cache tiny GGUFs
        uses: actions/cache@v6
        with:
          path: models
          key: e2e-models-${{ env.E2E_MODEL_SHA256 }}-${{ env.E2E_VISION_MODEL_SHA256 }}-${{ env.E2E_VISION_MMPROJ_SHA256 }}

      - name: Download tiny GGUFs
        run: |
          mkdir -p models
          fetch() { # url sha256 dest
            if ! echo "$2  $3" | sha256sum -c --status 2>/dev/null; then
              curl -fsSL --retry 3 -o "$3" "$1"
              echo "$2  $3" | sha256sum -c
            fi
          }
          fetch "$E2E_MODEL_URL" "$E2E_MODEL_SHA256" "$E2E_MODEL"
          fetch "$E2E_VISION_BASE/SmolVLM-256M-Instruct-Q8_0.gguf" "$E2E_VISION_MODEL_SHA256" "$E2E_VISION_MODEL"
          fetch "$E2E_VISION_BASE/mmproj-SmolVLM-256M-Instruct-Q8_0.gguf" "$E2E_VISION_MMPROJ_SHA256" "$E2E_VISION_MMPROJ"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          ram-size: 4096M
          disable-animations: true
          script: bash scripts/ci/emulator-e2e.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-screenshot
          path: |
            e2e-out/*.png
            e2e-out/logcat-filtered.txt
            e2e-out/instrumentation.txt
          if-no-files-found: warn

  screenshots-comment:
    name: Post screenshots on the PR
    needs: [android, emulator]
    if: always() && github.event_name == 'pull_request' && needs.android.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: screenshots
          path: shots

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: emulator-screenshot
          path: shots

      - name: Push PNGs to ci-screenshots and upsert the PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          dir="pr-$PR/$RUN_ID"
          git init -q pub
          cd pub
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth 1 origin ci-screenshots 2>/dev/null; then
            git checkout -q -b ci-screenshots FETCH_HEAD
          else
            git checkout -q --orphan ci-screenshots
          fi
          mkdir -p "$dir"
          find ../shots -name '*.png' -exec cp {} "$dir"/ \;
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Screenshots for PR #$PR (run $RUN_ID)"
          git push -q origin ci-screenshots

          base="https://raw.githubusercontent.com/${REPO}/ci-screenshots/${dir}"
          {
            echo "<!-- ferra-screenshots -->"
            echo "### Screenshots"
            echo "Commit ${SHA:0:7} · [run $RUN_ID](https://github.com/${REPO}/actions/runs/${RUN_ID})"
            echo
            echo "| Screen | Light | Dark |"
            echo "|---|---|---|"
            for light in $(ls "$dir" | grep '_light\.png$' | sort); do
              name="${light%_light.png}"
              dark="${name}_dark.png"
              darkcell="—"
              [ -f "$dir/$dark" ] && darkcell="<img src=\"$base/$dark\" width=\"260\">"
              echo "| \`$name\` | <img src=\"$base/$light\" width=\"260\"> | $darkcell |"
            done
            emu=$(ls "$dir" | grep -E '^(emulator_|e2e_)' | sort || true)
            if [ -n "$emu" ]; then
              echo
              echo "**Emulator (Pixel 7 profile, API 35, x86_64) — launch and end-to-end chat with a real GGUF:**"
              echo
              header="|"; sep="|"; row="|"
              for f in $emu; do
                header="$header \`${f%.png}\` |"; sep="$sep---|"; row="$row <img src=\"$base/$f\" width=\"200\"> |"
              done
              echo "$header"; echo "$sep"; echo "$row"
            fi
          } > ../body.md

          id=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- ferra-screenshots -->")) | .id' | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${id}" -F body=@../body.md > /dev/null
          else
            gh api "repos/${REPO}/issues/${PR}/comments" -F body=@../body.md > /dev/null
          fi
